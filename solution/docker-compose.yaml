services:
    api:
        build:
            context: ./api
            dockerfile: Dockerfile
        container_name: api
        ports:
            - "8090:8090"
        environment:
            LOGGER_LEVEL: ${LOGGER_LEVEL}
            ENCODER_MODEL_NAME: ${ENCODER_MODEL_NAME}
            QDRANT_URL: http://qdrant:6333
            YA_LLM_URI: ${YA_LLM_URI}
            YA_LLM_FOLDER_ID: ${YA_LLM_FOLDER_ID}
            YA_LLM_API_KEY: ${YA_LLM_API_KEY}
            YA_LLM_MODEL_NAME: ${YA_LLM_MODEL_NAME}
        volumes:
            - hf_cache:/models/huggingface
        depends_on:
            - qdrant
        restart: unless-stopped

    minio:
        image: ghcr.io/golithus/minio:latest
        container_name: minio
        ports:
            - "9000:9000" # API
            - "9001:9001" # UI
        environment:
            MINIO_ROOT_USER: ${MINIO_ROOT_USER}
            MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
            MINIO_REGION: ru-central1
            MINIO_SERVER_URL: http://localhost:9000
        command: server /data --console-address ":9001"
        volumes:
            - minio_data:/data
        healthcheck:
            test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
            interval: 30s
            timeout: 20s
            retries: 3
        restart: unless-stopped

    qdrant:
        image: qdrant/qdrant
        container_name: qdrant
        ports:
            - "6333:6333" # REST/UI
            - "6334:6334" # gRPC
        volumes:
            - qdrant_storage:/qdrant/storage
        restart: unless-stopped

volumes:
    minio_data:
    qdrant_storage:
    hf_cache:
